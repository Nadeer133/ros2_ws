- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"  # topic details from: gz topic -i -t /clock
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states" # for states of joints
  gz_topic_name: "/world/empty/model/my_robot/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model" 
  direction: GZ_TO_ROS

- ros_topic_name: "/tf" # for the odom and basefootprint
  gz_topic_name: "/model/my_robot/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V" 
  direction: GZ_TO_ROS

- ros_topic_name: "/cmd_vel" # robot movement
  gz_topic_name: "/model/my_robot/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist" 
  direction: ROS_TO_GZ

- ros_topic_name: "/camera/camera_info" # for camera
  gz_topic_name: "/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo" 
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/image_raw" # for camera
  gz_topic_name: "/camera/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image" 
  direction: GZ_TO_ROS

- ros_topic_name: "arm_base_forearm_joint/cmd_pos" # robot movement
  gz_topic_name: "/model/my_robot/joint/arm_base_forearm_joint/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double" 
  direction: ROS_TO_GZ

- ros_topic_name: "forearm_hand_joint/cmd_pos" # robot movement
  gz_topic_name: "/model/my_robot/joint/forearm_hand_joint/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double" 
  direction: ROS_TO_GZ