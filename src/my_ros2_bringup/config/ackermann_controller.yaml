# ============================================================
# ROS 2 CONTROLLER MANAGER
# ============================================================

controller_manager:
  ros__parameters:

    # Frequency at which the controller manager updates
    # the controllers and reads/writes hardware interfaces.
    #
    # 100 Hz means one update every 10 milliseconds.
    update_rate: 100


    # --------------------------------------------------------
    # JOINT STATE BROADCASTER
    # --------------------------------------------------------

    joint_state_broadcaster:

      # Publishes joint-state information obtained from
      # ros2_control hardware state interfaces.
      #
      # Examples:
      #   - Wheel angular position
      #   - Wheel angular velocity
      #   - Steering joint position
      #
      # Common output topic: /joint_states
      type: joint_state_broadcaster/JointStateBroadcaster


    # --------------------------------------------------------
    # ACKERMANN STEERING CONTROLLER
    # --------------------------------------------------------

    ackermann_steering_controller:

      # Loads the Ackermann steering controller plugin.
      #
      # This controller calculates:
      #   - Front-left steering angle
      #   - Front-right steering angle
      #   - Rear-left wheel velocity
      #   - Rear-right wheel velocity
      #
      # Based on the commanded vehicle motion and geometry.
      type: ackermann_steering_controller/AckermannSteeringController



# ============================================================
# ACKERMANN STEERING CONTROLLER PARAMETERS
# ============================================================

ackermann_steering_controller:
  ros__parameters:

    # --------------------------------------------------------
    # VEHICLE GEOMETRY
    # --------------------------------------------------------

    # Distance between front and rear axle centres.
    #
    # Unit: metres
    #
    # URDF:
    # Front axle X = +0.5
    # Rear axle X  = -0.5
    #
    # Wheelbase = 0.5 - (-0.5) = 1.0 m
    wheelbase: 1.0


    # Distance between the centres of the rear wheels.
    #
    # Unit: metres
    #
    # These are the traction wheels because our vehicle
    # uses rear-wheel drive.
    traction_track_width: 0.61


    # Distance between the centres of the front wheels.
    #
    # Unit: metres
    #
    # Used to calculate the different steering angles
    # required for the inner and outer front wheels.
    steering_track_width: 0.625


    # Radius of the rear traction wheels.
    #
    # Unit: metres
    #
    # Used to convert between wheel angular velocity
    # and vehicle linear velocity.
    #
    # Linear velocity = Angular velocity × Wheel radius
    traction_wheels_radius: 0.15


    # Radius of the front steering wheels.
    #
    # Unit: metres
    #
    # Used by the controller's steering kinematics
    # and wheel-state calculations where applicable.
    steering_wheels_radius: 0.15



    # --------------------------------------------------------
    # JOINT CONFIGURATION
    # --------------------------------------------------------

    # Names of the two rear traction joints.
    #
    # These names MUST match the URDF joint names.
    #
    # The controller commands angular velocity
    # through their velocity command interfaces.
    traction_joints_names:
      - rear_left_rack_wheel_joint
      - rear_right_rack_wheel_joint


    # Names of the two front steering joints.
    #
    # These names MUST match the URDF joint names.
    #
    # The controller commands steering angles
    # through their position command interfaces.
    steering_joints_names:
      - front_left_rack_steering_support_joint
      - front_right_rack_steering_support_joint



    # --------------------------------------------------------
    # FEEDBACK CONFIGURATION
    # --------------------------------------------------------

    # Determines which traction-wheel state interface
    # is used for odometry feedback.
    #
    # false:
    #   Use wheel angular velocity feedback.
    #
    # true:
    #   Use wheel angular position feedback.
    #   Wheel velocity is estimated from position changes.
    #
    # Both position and velocity state interfaces can
    # still exist in the URDF regardless of this setting.
    position_feedback: false


    # Determines whether odometry uses actual joint feedback
    # or commanded motion.
    #
    # false:
    #   Use measured joint states to estimate vehicle motion.
    #
    # true:
    #   Use commanded motion to estimate vehicle motion
    #   without relying on joint-state feedback.
    #
    # For our simulation, false is preferred because
    # we want to observe the simulated wheel behaviour.
    open_loop: false



    # --------------------------------------------------------
    # COMMAND TIMEOUT
    # --------------------------------------------------------

    # Maximum allowed time without receiving a new
    # motion reference before it is considered stale.
    #
    # Unit: seconds
    #
    # Example:
    #   If no new command arrives for 1 second,
    #   the controller treats the previous command
    #   as timed out and requests zero motion.
    #
    # This is a command timeout, not a complete
    # vehicle safety or emergency-stop mechanism.
    reference_timeout: 1.0



    # --------------------------------------------------------
    # ODOMETRY CONFIGURATION
    # --------------------------------------------------------

    # Name of the robot's body reference frame.
    #
    # Used as the child frame for odometry.
    #
    # Must correspond to a frame in the robot's TF tree.
    base_frame_id: base_link


    # Name of the odometry reference frame.
    #
    # Represents the locally estimated position
    # and orientation of the robot.
    odom_frame_id: odom


    # Controls whether the controller publishes
    # the odom -> base_link transform.
    #
    # true:
    #   Publish the odometry TF transform.
    #
    # false:
    #   Do not publish that transform.
    #
    # Only one component should publish the same
    # odom -> base_link transform.
    enable_odom_tf: true