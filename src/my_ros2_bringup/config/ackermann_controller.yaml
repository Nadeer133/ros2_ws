# ============================================================
# ROS 2 CONTROLLER MANAGER
# ============================================================

controller_manager:
  ros__parameters:

    # Frequency at which the controller manager updates
    # the controllers and reads/writes hardware interfaces.
    #
    # 100 Hz means one update every 10 milliseconds.
    update_rate: 100

    # --------------------------------------------------------
    # JOINT STATE BROADCASTER
    # --------------------------------------------------------

    joint_state_broadcaster:

      # Publishes joint-state information obtained from
      # ros2_control hardware state interfaces.
      #
      # Examples:
      #   - Wheel angular position
      #   - Wheel angular velocity
      #   - Steering joint position
      #
      # Common output topic: /joint_states
      type: joint_state_broadcaster/JointStateBroadcaster

    # --------------------------------------------------------
    # ACKERMANN STEERING CONTROLLER
    # --------------------------------------------------------

    ackermann_steering_controller:

      # Loads the Ackermann steering controller plugin.
      #
      # This controller calculates:
      #   - Front-left steering angle
      #   - Front-right steering angle
      #   - Rear-left wheel velocity
      #   - Rear-right wheel velocity
      #
      # Based on the commanded vehicle motion and geometry.
      type: ackermann_steering_controller/AckermannSteeringController


# ============================================================
# ACKERMANN STEERING CONTROLLER PARAMETERS
# ============================================================

ackermann_steering_controller:
  ros__parameters:

    # --------------------------------------------------------
    # VEHICLE GEOMETRY
    # --------------------------------------------------------

    # Distance between front and rear axle centres.
    #
    # Unit: metres
    #
    # Updated Xacro (base_length = 0.6 m):
    # Front axle X = +0.25 m
    # Rear axle X  = -0.25 m
    #
    # Wheelbase = 0.25 - (-0.25) = 0.50 m
    wheelbase: 0.5

    # Distance between the centres of the rear traction wheels.
    #
    # Unit: metres
    #
    # Updated Xacro (base_width = 0.30 m; wheel_length = 0.08 m):
    # Rear wheel centre Y = +/- (0.30/2 + 0.05 + 0.08)
    #                     = +/- 0.28 m
    # Rear traction track width = 0.56 m
    #
    # Rear wheels are driven (rear-wheel drive).
    traction_track_width: 0.56

    # Distance between the front steering pivot / wheel centres.
    #
    # Unit: metres
    #
    # Updated Xacro (base_width = 0.30 m):
    # Front steering centre Y = +/- (0.30/2 + 0.05 + 0.30/4)
    #                         = +/- 0.275 m
    # Front steering track width = 0.55 m
    #
    # Used to calculate different inner and outer steering angles.
    steering_track_width: 0.55

    # Radius of the rear traction wheels.
    #
    # Unit: metres
    #
    # Linear velocity = wheel angular velocity * wheel radius.
    traction_wheels_radius: 0.15

    # Radius of the front steering wheels.
    #
    # Unit: metres
    #
    # Matches the front wheel geometry in the Xacro.
    steering_wheels_radius: 0.15

    # Steering joint limits remain +/- 0.6 rad (about 34.4 degrees)
    # in the Xacro. With the geometry above, the theoretical minimum
    # turning radius measured at the rear axle midpoint is:
    # R_min = wheelbase/tan(0.6) + steering_track_width/2
    #       = 0.5/tan(0.6) + 0.55/2 ~= 1.006 m.
    # This is a geometric limit, not a guarantee against tire slip.

    # --------------------------------------------------------
    # JOINT CONFIGURATION
    # --------------------------------------------------------

    # Rear traction joint names must match the Xacro.
    # Controller commands their velocity interfaces.
    traction_joints_names:
      - rear_left_rack_wheel_joint
      - rear_right_rack_wheel_joint

    # Front steering joint names must match the Xacro.
    # Controller commands their position interfaces.
    steering_joints_names:
      - front_left_rack_steering_support_joint
      - front_right_rack_steering_support_joint

    # --------------------------------------------------------
    # FEEDBACK CONFIGURATION
    # --------------------------------------------------------

    # false: use traction-wheel velocity state for odometry.
    # true:  use traction-wheel position state for odometry.
    # Both interfaces can still be present in the Xacro.
    position_feedback: false

    # false: use joint-state feedback for odometry.
    # true:  estimate odometry from commanded motion (open-loop).
    # Keep false to observe simulated joint feedback.
    open_loop: false

    # --------------------------------------------------------
    # COMMAND TIMEOUT
    # --------------------------------------------------------

    # Maximum time (seconds) without a new reference before
    # the controller treats the command as stale and stops requesting
    # motion. This is not an emergency-stop safety mechanism.
    reference_timeout: 1.0

    # --------------------------------------------------------
    # ODOMETRY CONFIGURATION
    # --------------------------------------------------------

    # Robot body reference frame (odometry child frame).
    base_frame_id: base_link

    # Local odometry reference frame.
    odom_frame_id: odom

    # Publish odom -> base_link TF. Ensure only one node publishes
    # this same transform.
    enable_odom_tf: true
